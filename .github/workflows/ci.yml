name: Cfit CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cfit
          POSTGRES_USER: cfit
          POSTGRES_PASSWORD: cfit
        options: >-
          --health-cmd "pg_isready -U cfit -d cfit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "True"
          POSTGRES_DB: cfit
          POSTGRES_USER: cfit
          POSTGRES_PASSWORD: cfit
          POSTGRES_HOST: localhost
      - run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "True"
          POSTGRES_DB: cfit
          POSTGRES_USER: cfit
          POSTGRES_PASSWORD: cfit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
