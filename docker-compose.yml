services:
  postgres:
    image: postgres:17
    container_name: cfit_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - postgres

volumes:
  postgres_data:
